[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"


[project]
name = "cadastre-query-service"
version = "0.1.0"
description = "Асинхронный сервис кадастровых запросов"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [
    { name = "Батраз Секинаев" },
]
dependencies = [
    "fastapi>=0.138.2,<1.0.0",
    "uvicorn[standard]>=0.51.0,<1.0.0",
    "pydantic-settings>=2.14.2,<3.0.0",
    "sqlalchemy[asyncio]>=2.0.51,<3.0.0",
    "asyncpg>=0.31.0,<1.0.0",
    "alembic>=1.18.5,<2.0.0",
    "httpx>=0.28.1,<1.0.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-asyncio>=1.4.0,<2.0.0",
    "pytest-cov>=7.0.0,<8.0.0",
    "ruff>=0.16.0,<1.0.0",
    "httpx2",
]


[tool.setuptools.packages.find]
where = ["."]
include = [
    "app*",
    "external_emulator*",
]
exclude = [
    "tests*",
]


[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "migrations/versions",
]


[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "ASYNC",
    "RUF",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]
asyncio_mode = "auto"


[tool.coverage.run]
branch = true
source = [
    "app",
    "external_emulator",
]


[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85